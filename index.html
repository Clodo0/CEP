<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa por CEP</title>
    <link rel="stylesheet" href="./main.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="form-container">
        <h1 class="text-2xl font-bold text-center mb-6">Endereço</h1>
        <form id="addressForm" class="space-y-4">
            <!-- Campo CEP -->
            <div>
                <label for="cep" class="block text-sm font-medium text-gray-700">CEP:</label>
                <input type="text" id="cep" name="cep" placeholder="Digite o CEP" maxlength="9"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <!-- Botão de busca -->
            <button type="button" id="fetchAddressButton"
                class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Buscar Endereço
            </button>

            <!-- Logradouro -->
            <div>
                <label for="logradouro" class="block text-sm font-medium text-gray-700">Logradouro:</label>
                <input type="text" id="logradouro" name="logradouro" readonly
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-100">
            </div>

            <!-- Número -->
            <div>
                <label for="numero" class="block text-sm font-medium text-gray-700">Número:</label>
                <input type="text" id="numero" name="numero" placeholder="Digite o número"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Complemento -->
            <div>
                <label for="complemento" class="block text-sm font-medium text-gray-700">Complemento:</label>
                <input type="text" id="complemento" name="complemento" placeholder="Digite o complemento"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Bairro -->
            <div>
                <label for="bairro" class="block text-sm font-medium text-gray-700">Bairro:</label>
                <input type="text" id="bairro" name="bairro" readonly
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-100">
            </div>

            <!-- Cidade -->
            <div>
                <label for="localidade" class="block text-sm font-medium text-gray-700">Cidade:</label>
                <input type="text" id="localidade" name="localidade" readonly
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-100">
            </div>

            <!-- Estado -->
            <div>
                <label for="uf" class="block text-sm font-medium text-gray-700">Estado:</label>
                <input type="text" id="uf" name="uf" readonly
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-100">
            </div>

            <!-- Botão para salvar o endereço -->
            <button type="button" id="saveAddressButton"
                class="w-full bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500">
                Salvar Endereço
            </button>

            <!-- Mensagem de sucesso -->
            <div id="successMessage" class="hidden text-center text-green-600">
                Endereço salvo com sucesso!
            </div>
        </form>
    </div>

    <script type="module">
        import { setupCEPForm, setupSaveAddress } from './cep.js';

        setupCEPForm();

        setupSaveAddress();
    </script>
</body>
</html>
